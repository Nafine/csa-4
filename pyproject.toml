[project]
name = "csa-4"
version = "0.1.0"
description = "Computer Systems Architecture Lab 4: acc/neum/mc/tick simulator and alg-language compiler"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.15.11",
    "mypy>=1.11",
    "types-requests>=2.33.0.20260508",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
exclude = ["^test/"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
