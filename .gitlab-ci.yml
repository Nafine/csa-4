stages:
  - test

variables:
  UV_CACHE_DIR: ".uv-cache"

.uv-template: &uv_setup
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y curl
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="/root/.local/bin:$PATH"
    - uv sync --all-extras
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

lint:
  stage: test
  <<: *uv_setup
  script:
    - uv run ruff check .

typecheck:
  stage: test
  <<: *uv_setup
  script:
    - uv run mypy .

pytest:
  stage: test
  <<: *uv_setup
  script:
    - uv run pytest -q