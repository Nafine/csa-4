in_source: |-
  def main() void {
      print("What is your name?\n");
      var name int[32];
      var char int = -1;
      i := 0;

      while (i < 32 && char != 0) {
          char = read();
          name[i] = char;
          ++i;
      }
      print("Hi, ");

      i = 0;
      while (name[i] != 0) {
          print(name[i]);
          ++i;
      }
  }
