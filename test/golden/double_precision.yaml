in_source: |-
  // Demonstrates 64-bit addition on a 32-bit machine.
  // Each 64-bit value is represented as (hi, lo). Carry from lo to hi is
  // detected by splitting each 32-bit half into two 16-bit pieces, since the
  // language has no unsigned compare. Hardcoded operands; result is printed
  // as four bytes: hi_high, hi_low, lo_high, lo_low (each 0..255).

  def emit_word(w int) void {
      var b3 int = (w / 16777216) % 256;
      var b2 int = (w / 65536) % 256;
      var b1 int = (w / 256) % 256;
      var b0 int = w % 256;
      print(b3);
      print(b2);
      print(b1);
      print(b0);
  }

  def main() void {
      var a_hi int = 1;
      var a_lo int = 4294967294;
      var b_hi int = 0;
      var b_lo int = 5;

      var a_lo_hi int = a_lo / 65536;
      var a_lo_lo int = a_lo % 65536;
      var b_lo_hi int = b_lo / 65536;
      var b_lo_lo int = b_lo % 65536;

      var sum_lo int = a_lo_lo + b_lo_lo;
      var carry1 int = sum_lo / 65536;
      var part_lo int = sum_lo % 65536;

      var sum_hi int = a_lo_hi + b_lo_hi + carry1;
      var carry2 int = sum_hi / 65536;
      var part_hi int = sum_hi % 65536;

      var result_lo int = part_hi * 65536 + part_lo;
      var result_hi int = a_hi + b_hi + carry2;

      emit_word(result_hi);
      emit_word(result_lo);
  }
