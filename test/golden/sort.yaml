in_source: |-
  // Reads a null-terminated byte sequence from input, sorts it ascending, prints it.
  // Storage layout: scratch buffer at address 200 (free area between data and stack).

  def main() void {
      var BUF int = 200;
      var n int = 0;
      var c int = read();

      while (c != 0) {
          poke(BUF + n, c);
          n = n + 1;
          c = read();
      }

      var i int = 0;
      while (i < n) {
          var j int = 0;
          while (j < n - 1 - i) {
              var a int = peek(BUF + j);
              var b int = peek(BUF + j + 1);
              if (a > b) {
                  poke(BUF + j, b);
                  poke(BUF + j + 1, a);
              }
              j = j + 1;
          }
          i = i + 1;
      }

      var k int = 0;
      while (k < n) {
          print(peek(BUF + k));
          k = k + 1;
      }
  }
