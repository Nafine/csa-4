in_source: |-
  def main() void {
      var buf int[32];
      var n int = 0;
      var c int = read();

      while (c != 0) {
          buf[n] = c;
          n = n + 1;
          c = read();
      }

      var i int = 0;
      while (i < n) {
          var j int = 0;
          while (j < n - 1 - i) {
              var a int = buf[j];
              var b int = buf[j+1];
              if (a > b) {
                  buf[j] = b;
                  buf[j+1] = a;
              }
              ++j;
          }
          ++i;
      }

      var k int = 0;
      while (k < n) {
          print(buf[k]);
          k = k + 1;
      }
  }
