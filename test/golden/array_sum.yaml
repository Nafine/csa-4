in_source: |-
  def main() void {
      var arr int[5];
      var i int = 0;
      while (++i < 5) {
          arr[i] = i * i;
      }
      var sum int = 0;
      i = 0;
      while (++i < 5) {
          sum = sum + arr[i];
      }
      print(sum);
  }
