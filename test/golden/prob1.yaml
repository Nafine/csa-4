in_source: |-
  def is_palindrome(n int) bool {
      var original int = n;
      var reversed int = 0;

      while (n > 0) {
          var rem int = n % 10;
          reversed = (reversed * 10) + rem;
          n = n / 10;
      }

      return original == reversed;
  }

  def main() void {
      var max_pal int = 0;
      var i int = 999;

      while (i >= 100) {
          var j int = 999;

          while (j >= i) {
              var prod int = i * j;

              if (prod > max_pal) {
                  if (is_palindrome(prod)) {
                      max_pal = prod;
                  }
              }

              j = j - 1;
          }

          i = i - 1;
      }

      print(max_pal);
  }
